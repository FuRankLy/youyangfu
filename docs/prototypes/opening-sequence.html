function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 18; i++) {
      if (sx(t) < x) lo = t; else hi = t;
      t = (lo + hi) / 2;

  };

    root.style.setProperty("--ink-soft", pal.inkSoft);
    root.style.setProperty("--grid", pal.grid);
    root.style.setProperty("--line", pal.line);
    root.style.setProperty("--cinnabar", pal.cinnabar);
    const deg = Math.round(Math.abs(el));

    document.getElementById("aklTime").textContent = `Auckland ${aklFmt.format(now)}, ${sun}`;
    document.getElementById("zzTime").textContent = `Zhengzhou ${zzFmt.format(now)}`;
    nowLine.hidden = false;

    props.forEach(p => root.style.removeProperty("--" + p));

}
function readColors() {

  const v = n => cs.getPropertyValue(n).trim();
  colors = { paper: v("--paper"), ink: v("--ink"), inkSoft: v("--ink-soft"), grid: v("--grid"), cinnabar: v("--cinnabar") };
  buckets = [];
  for (let b = 0; b < NB; b++) buckets.push(mix(colors.cinnabar, colors.ink, b / (NB - 1)));

/* ---------- layout + cells ---------- */
function computeLayout() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";

  const barH = bar.getBoundingClientRect().height;
  const gutter = Math.max(24, W * 0.07);
  const S = Math.max(64, Math.min(248, (H - barH) * 0.34, (W - 2 * gutter) / 3.75));
  const gap = S * 0.14;
  const c = Math.max(2.5, Math.round((S / 50) * dpr) / dpr);
  const hanW = 3 * S + 2 * gap;
  const Z = S * 0.27, sealGap = S * 0.13;
  const groupW = hanW + sealGap + Z;
  const left = (W - groupW) / 2;
  const cy = (H - barH) / 2 + 4;
  const hanTop = cy - S / 2 - S * 0.1;
  const midY = hanTop + S / 2;

  // Latin name, measured to match the width of the three characters
  probe.font = `600 100px ${UI_FONT}`;
  if ("letterSpacing" in probe) probe.letterSpacing = "-2px";
  let m = probe.measureText(LATIN);
  const w100 = (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || m.width);
  const F = Math.min((100 * hanW * 0.98) / w100, S * 1.02);
  const font = `600 ${F}px ${UI_FONT}`;
  probe.font = font;
  if ("letterSpacing" in probe) probe.letterSpacing = `${-0.02 * F}px`;
  m = probe.measureText(LATIN);
  const latBL = m.actualBoundingBoxLeft || 0;
  const latW = latBL + (m.actualBoundingBoxRight || m.width);
  const capM = probe.measureText("F");
  const cap = capM.actualBoundingBoxAscent || F * 0.7;
  const latLeft = left + (hanW - latW) / 2;
  const baseline = midY + cap / 2;

  G = {
    S, gap, c, hanW, Z, sealGap, left, hanTop, midY, F, font, latLeft, latW, latBL, cap, baseline,
    sealHan: { x: left + hanW + sealGap, y: hanTop + S - Z },
    sealLat: { x: latLeft + latW + sealGap, y: baseline - Z },
    hanRect: { x: left, y: hanTop, w: hanW, h: S },
    latRect: { x: latLeft, y: baseline - cap, w: latW, h: cap },
  };
}

function project(m, x, y) {
  const p = m.pts;
  if (p.length < 2) return { u: 0, d: Math.hypot(x - p[0][0], y - p[0][1]) };
  let best = Infinity, bs = 0;
  for (let i = 0; i < p.length - 1; i++) {
    const ax = p[i][0], ay = p[i][1], vx = p[i + 1][0] - ax, vy = p[i + 1][1] - ay;
    const l2 = vx * vx + vy * vy || 1;
    const t = clamp(((x - ax) * vx + (y - ay) * vy) / l2);
    const qx = ax + t * vx, qy = ay + t * vy;
    const d = (x - qx) * (x - qx) + (y - qy) * (y - qy);
    if (d < best) { best = d; bs = m.cum[i] + t * Math.sqrt(l2); }
  }
  return { u: bs / m.len, d: Math.sqrt(best) };
}

function buildHanCells() {
  const { S, gap, c, left, hanTop } = G;
  const sc = 1024 / S;
  const out = [];
  const rand = rng(1984);
  NAME_KEYS.forEach((key, ci) => {
    const g = glyphs[key];
    const bx = left + ci * (S + gap), by = hanTop;
    const i0 = Math.ceil(bx / c - 0.5), i1 = Math.floor((bx + S) / c - 0.5);
    const j0 = Math.ceil(by / c - 0.5), j1 = Math.floor((by + S) / c - 0.5);
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const x = (i + 0.5) * c, y = (j + 0.5) * c;
        const dx = (x - bx) * sc, dy = 900 - (y - by) * sc;
        for (let si = 0; si < g.paths.length; si++) {
          if (probe.isPointInPath(g.paths[si], dx, dy)) {
            const pr = project(g.medians[si], dx, dy);
            const sch = schedule[ci + ":" + si];
            const t = sch.start + invert(EASE.brush, pr.u) * sch.dur + pr.d * 0.2 + rand() * 12;
            out.push({ x, y, t });
            break;
          }
        }
      }
    }
  });
  return out;
}

function buildLatinCells() {
  const { c, latLeft, latBL, baseline, cap, latW, font, F } = G;
  const x0 = Math.floor(latLeft - c * 3), y0 = Math.floor(baseline - cap - c * 4);
  const w = Math.ceil(latW + c * 6), h = Math.ceil(cap + c * 8);
  const oc = document.createElement("canvas");
  oc.width = w; oc.height = h;
  const o = oc.getContext("2d");
  o.font = font;
  if ("letterSpacing" in o) o.letterSpacing = `${-0.02 * F}px`;
  o.fillStyle = "#000";
  o.textBaseline = "alphabetic";
  o.fillText(LATIN, latLeft + latBL - x0, baseline - y0);
  const data = o.getImageData(0, 0, w, h).data;
  const at = (x, y) => {
    const px = Math.round(x - x0), py = Math.round(y - y0);
    if (px < 0 || py < 0 || px >= w || py >= h) return 0;
    return data[(py * w + px) * 4 + 3] > 127 ? 1 : 0;
  };
  const out = [];
  const i0 = Math.ceil(x0 / c - 0.5), i1 = Math.floor((x0 + w) / c - 0.5);
  const j0 = Math.ceil(y0 / c - 0.5), j1 = Math.floor((y0 + h) / c - 0.5);
  const q = c * 0.25;
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      const x = (i + 0.5) * c, y = (j + 0.5) * c;
      const n = at(x - q, y - q) + at(x + q, y - q) + at(x - q, y + q) + at(x + q, y + q);
      if (n >= 2) out.push({ x, y });
    }
  }
  return out;
}

function buildParticles() {
  const han = buildHanCells();
  const lat = buildLatinCells();
  const hs = han.map((_, i) => i).sort((a, b) => han[a].x - han[b].x || han[a].y - han[b].y);
  const ls = lat.map((_, i) => i).sort((a, b) => lat[a].x - lat[b].x || lat[a].y - lat[b].y);
  P = Math.max(han.length, lat.length);
  const F32 = () => new Float32Array(P);
  A = {
    hx: F32(), hy: F32(), lx: F32(), ly: F32(), rev: F32(),
    dupH: new Uint8Array(P), dupL: new Uint8Array(P),
    fx: F32(), fy: F32(), fs: F32(), fa: F32(), ta: F32(),
    cx: F32(), cy: F32(), cs: F32(), ca: F32(),
    kx: F32(), ky: F32(), bump: F32(), delay: F32(), dir: F32(), r: F32(),
  };
  const rand = rng(2016);
  let prevH = -1, prevL = -1;
  for (let j = 0; j < P; j++) {
    const hi = Math.floor((j * han.length) / P), li = Math.floor((j * lat.length) / P);
    const hc = han[hs[hi]], lc = lat[ls[li]];
    A.hx[j] = hc.x; A.hy[j] = hc.y; A.rev[j] = hc.t;
    A.lx[j] = lc.x; A.ly[j] = lc.y;
    A.dupH[j] = hi === prevH ? 1 : 0; A.dupL[j] = li === prevL ? 1 : 0;
    prevH = hi; prevL = li;
    A.dir[j] = rand() < 0.5 ? -1 : 1;
    A.r[j] = rand();
    A.bump[j] = 0.22 + 0.5 * rand();
  }
  restAt(shape);
}

function restAt(which) {
  for (let j = 0; j < P; j++) {
    A.cx[j] = which === "han" ? A.hx[j] : A.lx[j];
    A.cy[j] = which === "han" ? A.hy[j] : A.ly[j];
    A.cs[j] = 1; A.ca[j] = 0;
  }
}

/* ---------- seal ---------- */
function makeSeal(Z) {
  const s = Math.max(8, Math.ceil(Z * dpr));
  const oc = document.createElement("canvas");
  oc.width = oc.height = s;
  const o = oc.getContext("2d");
  const r = rng(616);
  const j = s * 0.012;
  o.fillStyle = colors.cinnabar;
  o.beginPath();
  const n = 18;
  for (let i = 0; i <= n; i++) o.lineTo((i / n) * s, j * r());
  for (let i = 0; i <= n; i++) o.lineTo(s - j * r(), (i / n) * s);
  for (let i = n; i >= 0; i--) o.lineTo((i / n) * s, s - j * r());
  for (let i = n; i >= 0; i--) o.lineTo(j * r(), (i / n) * s);
  o.closePath();
  o.fill();

  // carve the four characters out of the stone (白文)
  o.globalCompositeOperation = "destination-out";
  const pad = s * 0.09, gp = s * 0.035, q = (s - 2 * pad - gp) / 2;
  const grow = 1.1;
  const k = (q * grow) / 1024;
  SEAL_GRID.forEach((rowKeys, ri) => rowKeys.forEach((key, ci) => {
    const x = pad + ci * (q + gp) - (q * (grow - 1)) / 2;
    const y = pad + ri * (q + gp) - (q * (grow - 1)) / 2;
    o.setTransform(k, 0, 0, -k, x, y + 900 * k);
    o.lineWidth = 34; o.lineJoin = "round";
    for (const p of glyphs[key].paths) { o.fill(p); o.stroke(p); }
  }));
  o.setTransform(1, 0, 0, 1, 0, 0);

  // uneven paste: small voids, heavier near the edges
  const specks = Math.round(s * s * 0.004);
  for (let i = 0; i < specks; i++) {
    const edge = r() < 0.45;
    let x = r() * s, y = r() * s;
    if (edge) { const side = Math.floor(r() * 4); if (side === 0) y = r() * s * 0.06; else if (side === 1) x = s - r() * s * 0.06; else if (side === 2) y = s - r() * s * 0.06; else x = r() * s * 0.06; }
    o.globalAlpha = 0.2 + 0.7 * r();
    o.beginPath(); o.arc(x, y, (0.3 + r() * 1.1) * dpr * 0.7, 0, Math.PI * 2); o.fill();
  }
  o.globalAlpha = 1;
  o.globalCompositeOperation = "source-over";
  return oc;
}

/* ---------- morph ---------- */
function hTarget(to) { return to === "han" ? 1 : 0; }
function startMorph(to) {
  if (target === to) return;
  hFrom = hNow;
  target = to;
  if (reduceMQ.matches) {
    morph = null; shape = to; hNow = hTarget(to); restAt(to);
    return;
  }
  const { S, left, hanW } = G;
  for (let j = 0; j < P; j++) {
    const fx = A.cx[j], fy = A.cy[j];
    const tx = to === "han" ? A.hx[j] : A.lx[j];
    const ty = to === "han" ? A.hy[j] : A.ly[j];
    A.fx[j] = fx; A.fy[j] = fy; A.fs[j] = A.cs[j]; A.fa[j] = A.ca[j];
    A.ta[j] = Math.round((A.ca[j] + A.dir[j] * Math.PI / 2) / (Math.PI / 2)) * (Math.PI / 2);
    const dist = Math.hypot(tx - fx, ty - fy);
    const lift = Math.min(dist * 0.5 + S * 0.12, S * 0.75) * (0.55 + 0.45 * A.r[j]);
    A.kx[j] = (fx + tx) / 2 + (A.r[(j * 7) % P] - 0.5) * S * 0.35;
    A.ky[j] = (fy + ty) / 2 - lift;
    A.delay[j] = SPREAD * D_FLIGHT * clamp((fx - left) / hanW) + A.r[(j * 13) % P] * 0.1 * D_FLIGHT;
  }
  morph = { start: T, to };
}

/* ---------- drawing ---------- */
function drawGrid(p) {
  if (p <= 0.002) return;
  const { S, gap, left, hanTop } = G;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.strokeStyle = colors.grid;
  ctx.lineWidth = 1;
  for (let ci = 0; ci < 3; ci++) {
    const bx = left + ci * (S + gap), by = hanTop;
    const cx = bx + S / 2, cy = by + S / 2, hs = (S / 2) * p;
    ctx.globalAlpha = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(cx - hs, cy); ctx.lineTo(cx + hs, cy);
    ctx.moveTo(cx, cy - hs); ctx.lineTo(cx, cy + hs);
    ctx.moveTo(cx - hs, cy - hs); ctx.lineTo(cx + hs, cy + hs);
    ctx.moveTo(cx + hs, cy - hs); ctx.lineTo(cx - hs, cy + hs);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = p;
    ctx.strokeRect(bx + 0.5, by + 0.5, S - 1, S - 1);
  }
  ctx.globalAlpha = 1;
}

function drawPinyin(alpha) {
  if (alpha <= 0.002) return;
  const { S, gap, left, hanTop } = G;
  const fs = Math.max(12, Math.min(17, S * 0.075));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `500 ${fs}px ${UI_FONT}`;
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";
  const y = hanTop + S + fs * 2.1;
  PINYIN.forEach((p, i) => {
    const a = alpha * EASE.out(clamp((T - T_PINYIN - i * 110) / 480));
    if (a <= 0.002) return;
    const cxm = left + i * (S + gap) + S / 2;
    const tw = ctx.measureText(p.text).width;
    const cw = fs * 1.15, ch = fs * 0.78, sp = fs * 0.5;
    const x0 = cxm - (tw + sp + cw) / 2;
    const rise = (1 - a) * 6;
    ctx.globalAlpha = a;
    ctx.fillStyle = colors.inkSoft;
    ctx.fillText(p.text, x0, y + rise);
    // tone contour, Chao 1 to 5 scale, with the reference bar on its right
    const top = y - fs * 0.74 + rise, bx = x0 + tw + sp;
    const ly = lvl => top + ch * (5 - lvl) / 4;
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx + cw + 3.5, top); ctx.lineTo(bx + cw + 3.5, top + ch); ctx.stroke();
    const pr = EASE.settle(clamp((T - T_PINYIN - i * 110 - 160) / 520));
    if (pr > 0) {
      const xa = bx, ya = ly(p.chao[0]), xb = bx + cw, yb = ly(p.chao[1]);
      ctx.strokeStyle = colors.inkSoft;
      ctx.lineWidth = 1.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(lerp(xa, xb, pr), lerp(ya, yb, pr)); ctx.stroke();
      if (pr > 0.97) {
        ctx.fillStyle = colors.cinnabar;
        ctx.beginPath(); ctx.arc(xb, yb, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  });
  ctx.globalAlpha = 1;
}

function proximity(x, y) {
  if (pointer.s <= 0.001) return 1;
  const R = G.S * 0.6;
  const dx = x - pointer.x, dy = y - pointer.y;
  const d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return 1;
  const k = 1 - Math.sqrt(d2) / R;
  return 1 + 0.55 * k * k * pointer.s;
}

function drawParticles() {
  const { c } = G;
  const base = c * 0.8 * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (morph) {
    ctx.fillStyle = colors.ink;
    const el = T - morph.start;
    for (let j = 0; j < P; j++) {
      const e = clamp((el - A.delay[j]) / D_FLIGHT);
      const ee = EASE.flight(e);
      const tx = morph.to === "han" ? A.hx[j] : A.lx[j];
      const ty = morph.to === "han" ? A.hy[j] : A.ly[j];
      const u = 1 - ee;
      const x = u * u * A.fx[j] + 2 * u * ee * A.kx[j] + ee * ee * tx;
      const y = u * u * A.fy[j] + 2 * u * ee * A.ky[j] + ee * ee * ty;
      const s = lerp(A.fs[j], 1, ee) + A.bump[j] * Math.sin(Math.PI * ee);
      const a = lerp(A.fa[j], A.ta[j], ee);
      A.cx[j] = x; A.cy[j] = y; A.cs[j] = s; A.ca[j] = a;
      const size = base * s;
      if (e <= 0 || e >= 1) {
        const pk = proximity(x, y);
        const sz = Math.round(size * pk);
        ctx.fillRect(Math.round(x * dpr - sz / 2), Math.round(y * dpr - sz / 2), sz, sz);
      } else {
        const cs = Math.cos(a), sn = Math.sin(a);
        ctx.setTransform(cs, sn, -sn, cs, x * dpr, y * dpr);
        ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
    }
    if (el >= D_MORPH) {
      shape = morph.to; morph = null;
      for (let j = 0; j < P; j++) { A.cs[j] = 1; A.ca[j] = 0; }
    }
    return;
  }

  if (shape === "han") {
    // writing, then resting as characters
    let wetAny = false;
    ctx.fillStyle = colors.ink;
    for (let j = 0; j < P; j++) {
      if (A.dupH[j]) continue;
      const age = T - A.rev[j];
      if (age < 0) continue;
      if (age < WET) { wetAny = true; continue; }
      const x = A.hx[j], y = A.hy[j];
      const sz = Math.round(base * proximity(x, y));
      ctx.fillRect(Math.round(x * dpr - sz / 2), Math.round(y * dpr - sz / 2), sz, sz);
    }
    if (wetAny) {
      for (let b = 0; b < NB - 1; b++) {
        ctx.fillStyle = buckets[b];
        for (let j = 0; j < P; j++) {
          if (A.dupH[j]) continue;
          const age = T - A.rev[j];
          if (age < 0 || age >= WET) continue;
          if (Math.min(NB - 2, Math.floor((age / WET) * (NB - 1))) !== b) continue;
          const s = age < SCALE_IN ? backOut(age / SCALE_IN) : 1;
          const sz = base * s;
          ctx.fillRect(A.hx[j] * dpr - sz / 2, A.hy[j] * dpr - sz / 2, sz, sz);
        }
      }
    }
    return;
  }

  // resting as Latin, with the stamp's small shock
  ctx.fillStyle = colors.ink;
  let sh = null;
  if (shock) {
    const age = T - shock.t;
    if (age > 700) shock = null;
    else sh = { amp: G.c * 0.75 * Math.exp(-age / 120) * Math.sin(age / 36), x: shock.x, y: shock.y, R: G.S * 1.5 };
  }
  for (let j = 0; j < P; j++) {
    if (A.dupL[j]) continue;
    let x = A.lx[j], y = A.ly[j];
    if (sh) {
      const dx = x - sh.x, dy = y - sh.y, d = Math.hypot(dx, dy) || 1;
      if (d < sh.R) { const f = sh.amp * Math.pow(1 - d / sh.R, 2); x += (dx / d) * f; y += (dy / d) * f; }
    }
    const sz = Math.round(base * proximity(x, y));
    ctx.fillRect(Math.round(x * dpr - sz / 2), Math.round(y * dpr - sz / 2), sz, sz);
  }
}

function sealPos(h) {
  return { x: lerp(G.sealLat.x, G.sealHan.x, h), y: lerp(G.sealLat.y, G.sealHan.y, h) };
}

function drawSeal(h) {
  if (T < T_STAMP || !sealCanvas) return;
  const k = clamp((T - T_STAMP) / D_STAMP);
  const { Z } = G;
  const pos = sealPos(h);
  let scale, rot, alpha, blur, off, shA;
  const IMPACT = 0.42;
  if (k < IMPACT) {
    const q = k / IMPACT, qi = Math.pow(q, 2.2);
    scale = 1.6 - 0.63 * qi; rot = -8 + 5.5 * qi; alpha = clamp(q * 2.4);
    blur = 26 * (1 - q) + 2; off = 16 * (1 - q) + 1; shA = 0.28;
  } else {
    const q = EASE.settle((k - IMPACT) / (1 - IMPACT));
    scale = 0.97 + 0.03 * q; rot = -2.5 + 0.5 * q; alpha = 1;
    blur = 2; off = 1; shA = 0.28 * (1 - q);
    if (!shock && !G.shocked) { shock = { t: T, x: pos.x + Z / 2, y: pos.y + Z / 2 }; G.shocked = true; }
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(pos.x + Z / 2, pos.y + Z / 2);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  if (shA > 0.01) {
    ctx.shadowColor = `rgba(0,0,0,${shA})`;
    ctx.shadowBlur = blur * dpr;
    ctx.shadowOffsetY = off * dpr;
  }
  ctx.drawImage(sealCanvas, -Z / 2, -Z / 2, Z, Z);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function currentH() {
  if (!morph) return hTarget(shape);
  const p = EASE.settle(clamp((T - morph.start) / (D_FLIGHT * (1 + SPREAD))));
  return lerp(hFrom, hTarget(morph.to), p);
}

function placeHits(h) {
  const idle = T >= T_IDLE;
  nameHit.disabled = !idle; sealHit.disabled = !idle;
  if (!idle) return;
  const a = G.hanRect, b = G.latRect, pad = G.c * 3;
  const x = Math.min(a.x, b.x) - pad, y = Math.min(a.y, b.y) - pad;
  const w = Math.max(a.x + a.w, b.x + b.w) + pad - x, hh = Math.max(a.y + a.h, b.y + b.h) + pad - y;
  Object.assign(nameHit.style, { left: x + "px", top: y + "px", width: w + "px", height: hh + "px" });
  const sp = sealPos(h), Z = G.Z;
  Object.assign(sealHit.style, { left: sp.x - 4 + "px", top: sp.y - 4 + "px", width: Z + 8 + "px", height: Z + 8 + "px" });
  const tipW = Math.min(240, W - 32);
  const tx = clamp(sp.x + Z / 2 - tipW / 2, 16, W - 16 - tipW);
  Object.assign(sealTip.style, { left: tx + "px", top: sp.y + Z + 14 + "px", width: tipW + "px" });
}

/* ---------- loop ---------- */
function frame(now) {
  const dt = Math.min(64, now - (last || now));
  last = now;
  T += dt * speed;
  pointer.s += ((pointer.active ? 1 : 0) - pointer.s) * Math.min(1, dt / 140);

  if (!introMorphDone && T >= T_MORPH) { introMorphDone = true; startMorph("lat"); }

  hNow = currentH();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const gridIntro = EASE.out(clamp(T / 800));
  drawGrid(gridIntro * EASE.settle(hNow));
  drawPinyin(clamp(hNow * 1.7 - 0.7));
  drawParticles();
  drawSeal(hNow);
  placeHits(hNow);
  requestAnimationFrame(frame);
}

function replay() {
  T = reduceMQ.matches ? T_IDLE + 1 : 0;
  introMorphDone = reduceMQ.matches;
  morph = null; shock = null;
  if (G) G.shocked = reduceMQ.matches;
  shape = target = reduceMQ.matches ? "lat" : "han";
  hNow = hTarget(shape);
  if (A) restAt(shape);
}

function rebuild() {
  computeLayout();
  if (morph) { shape = morph.to; morph = null; }
  target = shape;
  G.shocked = T >= T_STAMP;
  buildParticles();
  sealCanvas = makeSeal(G.Z);
}

/* ---------- input ---------- */
window.addEventListener("pointermove", e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = e.pointerType === "mouse"; });
document.addEventListener("pointerleave", () => { pointer.active = false; });
window.addEventListener("blur", () => { pointer.active = false; });
nameHit.addEventListener("pointerdown", e => { lastPointerType = e.pointerType; });
nameHit.addEventListener("pointerenter", e => { if (e.pointerType === "mouse" && T >= T_IDLE) startMorph("han"); });
nameHit.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && T >= T_IDLE) startMorph("lat"); });
nameHit.addEventListener("click", e => {
  if (T < T_IDLE) return;
  if (e.detail !== 0 && lastPointerType === "mouse") return;
  startMorph(target === "han" ? "lat" : "han");
});
document.getElementById("replay").addEventListener("click", replay);
const slowBtn = document.getElementById("slow");
slowBtn.addEventListener("click", () => {
  speed = speed === 1 ? 0.3 : 1;
  slowBtn.setAttribute("aria-pressed", String(speed !== 1));
});
document.querySelectorAll(".seg .ctl").forEach(b => b.addEventListener("click", () => {
  themeMode = b.dataset.mode;
  try { localStorage.setItem("fu-proto-theme", themeMode); } catch (e) {}
  applyTheme();
}));
let rT = 0;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(rebuild, 120); });
setInterval(() => { if (themeMode === "now") applyTheme(); }, 30000);

/* ---------- boot ---------- */
function boot() {
  if (started) return;
  started = true;
  applyTheme();
  computeLayout();
  replay();
  buildParticles();
  sealCanvas = makeSeal(G.Z);
  requestAnimationFrame(frame);
}
const fontReady = document.fonts && document.fonts.load
  ? Promise.race([document.fonts.load(`600 100px "Instrument Sans"`), new Promise(r => setTimeout(r, 1500))])
  : Promise.resolve();
fontReady.then(boot, boot);
})();
</script>
</body></html>
